<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="设置 · AI 侧边栏助手">设置 · AI 侧边栏助手</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="⚙ AI 侧边栏助手 · 设置">⚙ AI 侧边栏助手 · 设置</h1>

    <section class="card">
      <h2 data-i18n="基本设置">基本设置</h2>
      <label class="field">
        <span data-i18n="界面语言 (Language)">界面语言 (Language)</span>
        <select id="opt-locale">
          <option value="zh" data-i18n="简体中文">简体中文</option>
          <option value="en">English</option>
        </select>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="复制设置">复制设置</h2>

      <label class="field">
        <span data-i18n="默认标签页复制格式">默认标签页复制格式</span>
        <select id="opt-copyFormat">
          <option value="title-url" data-i18n="标题 - URL">标题 - URL</option>
          <option value="title" data-i18n="仅标题">仅标题</option>
          <option value="url" data-i18n="仅 URL">仅 URL</option>
          <option value="markdown" data-i18n="Markdown: [标题](URL)">Markdown: [标题](URL)</option>
          <option value="bracket" data-i18n="[标题] URL">[标题] URL</option>
          <option value="html" data-i18n="HTML 链接">HTML 链接</option>
          <option value="csv">CSV</option>
          <option value="json">JSON</option>
          <option value="htmltable" data-i18n="HTML 表格">HTML 表格</option>
        </select>
      </label>

      <label class="field">
        <span data-i18n="选中文字复制格式">选中文字复制格式</span>
        <select id="opt-autoCopyFormat">
          <option value="plain" data-i18n="纯文本">纯文本</option>
          <option value="markdown" data-i18n="Markdown（保留格式）">Markdown（保留格式）</option>
        </select>
      </label>

      <label class="field">
        <span data-i18n="自动复制最小字符数">自动复制最小字符数</span>
        <input type="number" id="opt-minChars" min="1" max="999" />
      </label>

      <label class="field">
        <span data-i18n="剪贴板历史最大条数">剪贴板历史最大条数</span>
        <input type="number" id="opt-historyLimit" min="10" max="5000" step="10" />
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="功能开关">功能开关</h2>
      <label class="field-inline">
        <input type="checkbox" id="opt-superCopy" />
        <span data-i18n="超级复制（破解禁止复制/右键/选择）">超级复制（破解禁止复制/右键/选择）</span>
      </label>
      <label class="field-inline">
        <input type="checkbox" id="opt-autoCopy" />
        <span data-i18n="选中文字自动复制">选中文字自动复制</span>
      </label>
      <label class="field-inline">
        <input type="checkbox" id="opt-showFloatBtn" />
        <span data-i18n="选中后显示浮动&quot;发到侧边栏&quot;按钮">选中后显示浮动"发到侧边栏"按钮</span>
      </label>
      <label class="field-inline">
        <input type="checkbox" id="opt-showLauncher" />
        <span data-i18n="页面悬浮入口（每个网页显示打开侧边栏的悬浮图标）">页面悬浮入口（每个网页显示打开侧边栏的悬浮图标）</span>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="AI 站点管理">AI 站点管理</h2>
      <p class="hint" data-i18n="侧边栏顶部显示的 AI 站点。可增删改顺序。留空将恢复默认。">侧边栏顶部显示的 AI 站点。可增删改顺序。留空将恢复默认。</p>
      <div id="sites-list" class="sites-list"></div>
      <div class="sites-add">
        <input type="text" id="site-name" data-i18n-placeholder="显示名称（如 ChatGPT）" placeholder="显示名称（如 ChatGPT）" />
        <input type="text" id="site-url" data-i18n-placeholder="URL（https://...）" placeholder="URL（https://...）" />
        <input type="text" id="site-icon" data-i18n-placeholder="图标 emoji（可空）" placeholder="图标 emoji（可空）" maxlength="4" />
        <button id="btn-site-add" data-i18n="添加">添加</button>
      </div>
      <div class="sites-actions">
        <button id="btn-site-reset" class="ghost" data-i18n="恢复默认站点">恢复默认站点</button>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="自定义提示词模板">自定义提示词模板</h2>
      <p class="hint"><span data-i18n="配置后，可在侧边栏的组装输入框内一键插入，或键入 ">配置后，可在侧边栏的组装输入框内一键插入，或键入 </span><code data-i18n="/触发标志">/触发标志</code><span data-i18n=" 快速匹配。"> 快速匹配。</span></p>
      <div id="prompts-list" class="prompts-list"></div>
      <div class="prompts-add" style="display: flex; gap: 8px; margin-top: 12px; flex-direction: column;">
        <div style="display: flex; gap: 8px;">
          <input type="text" id="prompt-trigger" data-i18n-placeholder="触发标志 (如 fy)" placeholder="触发标志 (如 fy)" style="width: 160px;" />
          <button id="btn-prompt-add" data-i18n="添加模板">添加模板</button>
        </div>
        <textarea id="prompt-content" rows="3" data-i18n-placeholder="提示词内容 (如：请将以下内容翻译为中文：)" placeholder="提示词内容 (如：请将以下内容翻译为中文：)" style="resize: vertical; padding: 8px; font-family: inherit; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; transition: border-color 0.2s;"></textarea>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="站点级超级复制">站点级超级复制</h2>
      <p class="hint"><span data-i18n="为特定域名单独设置（优先级高于全局）。格式：每行一个域名，前加 ">为特定域名单独设置（优先级高于全局）。格式：每行一个域名，前加 </span><code>+</code><span data-i18n=" 强制开启，"> 强制开启，</span><code>-</code><span data-i18n=" 强制关闭。"> 强制关闭。</span></p>
      <textarea id="opt-overrides" rows="4" placeholder="+wenku.baidu.com&#10;-example.com"></textarea>
    </section>

    <section class="card">
      <h2 data-i18n="数据备份">数据备份</h2>
      <p class="hint" data-i18n="导出当前所有数据（设置、提示词、剪贴板历史、站点列表）为 JSON 文件，重装或换电脑时可一键导入恢复。">导出当前所有数据（设置、提示词、剪贴板历史、站点列表）为 JSON 文件，重装或换电脑时可一键导入恢复。</p>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <button id="btn-export" class="ghost" data-i18n="⬇ 导出备份 (JSON)">⬇ 导出备份 (JSON)</button>
        <button id="btn-import" class="ghost" data-i18n="⬆ 导入备份">⬆ 导入备份</button>
        <input type="file" id="import-file" accept="application/json,.json" style="display:none;" />
      </div>
    </section>

    <div class="bar">
      <span id="status" class="status" style="color: #10b981;" data-i18n="已开启自动保存">已开启自动保存</span>
    </div>
  </div>

  <script src="../../lib/i18n.js"></script>
  <script src="../../lib/storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
